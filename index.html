:root{ --bg:#141414; --ink:#ecebe7; --dim:rgba(236,235,231,.45); }
*{ box-sizing:border-box }
html,body{ height:100% }
body{ margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"Instrument Sans",-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
a{ color:var(--ink); text-decoration:none } a:hover{ opacity:.6 }
button{ font-family:inherit }

#intro{ position:fixed; inset:0; z-index:80; background:var(--bg); overflow:hidden;

#intro.done{ opacity:0; pointer-events:none }
#iworld{ position:absolute; inset:0; transform-origin:0 0; will-change:transform }
#iworld .t{ position:absolute; overflow:hidden; background-size:cover; background-position:center; will-change:transform }
/* the focal tile carries the SAME inner .part structure as #focus (112%

#iworld .t .part{ position:absolute; left:-6%; top:-6%; width:112%; height:112%;

#pct{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:81;

  font-variant-numeric:tabular-nums; mix-blend-mode:difference; transition:opacity 300ms }

/* ---------- collage strip ---------- */
#stage{ position:fixed; inset:0; opacity:0; transition:opacity 300ms ease }
#stage.on{ opacity:1 }
#track{ position:absolute; inset:0; will-change:transform }
.pic{ position:absolute; overflow:hidden; cursor:pointer; will-change:transform;
  transform:translateZ(0); background:#1b1b1b }
.pic .part{ position:absolute; left:-12%; top:-6%; width:124%; height:112%;
  background-size:cover; background-position:center; will-change:transform; transform:translateZ(0) }

/* focus clone (FLIP: strip rect -> full bleed) */
#focus{ position:fixed; left:0; top:0; z-index:64; overflow:hidden; display:none;
  transform-origin:0 0; will-change:transform; background:#1b1b1b }
#focus .part{ position:absolute; left:-6%; top:-6%; width:112%; height:112%;

#focusTitle{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:66; margin:0;

  text-shadow:0 1px 24px rgba(0,0,0,.5); will-change:opacity }

.chrome{ position:fixed; z-index:70; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim) }
/* intro handoff: menu / chrome / filmstrip fade in on their own, the image
   itself never changes. body starts .pre (chrome hidden); removing it at
   the end of the zoom triggers one gentle fade-in. */
@keyframes chromeIn{ from{opacity:0} }
body.pre .chrome, body.pre #strip{ opacity:0 !important; pointer-events:none }
body:not(.pre) .chrome, body:not(.pre) #strip{ animation:chromeIn 900ms ease }
#c-name{ top:4vmin; left:5vmin; color:var(--ink) }
#c-about{ top:4vmin; right:5vmin }
#c-index{ bottom:4vmin; left:5vmin; font-variant-numeric:tabular-nums }
#c-credit{ bottom:1.2vmin; left:50%; transform:translateX(-50%); font-size:.6rem; letter-spacing:.12em; opacity:.6 }
#strip{ position:fixed; bottom:3.4vmin; right:5vmin; z-index:70; display:flex; gap:.5rem; transition:opacity 300ms }
#strip.hide{ opacity:0; pointer-events:none }
#strip button{ width:52px; height:34px; border:1px solid transparent; padding:0; cursor:pointer;
  background-size:cover; background-position:center; opacity:.5; transition:opacity 300ms, border-color 300ms }
#strip button:hover{ opacity:1 }
#strip button.on{ opacity:1; border-color:var(--ink) }

#project{ position:fixed; inset:0; z-index:65; pointer-events:none; visibility:hidden }

#p-scroll{ position:absolute; inset:0; will-change:transform }
#p-spacer{ height:100vh }
#p-body{ background:var(--bg); pointer-events:auto }

const damp=(c,t,l,dt)=> c+(t-c)*(1-Math.exp(-l*dt));
const easeOutCubic=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
const easeInOut=t=>{ t=Math.max(0,Math.min(1,t)); return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; };
/* SPLINE-VELOCITY EASE.
   The velocity curve is a smooth spline through a handful of control
   points: pinned (0,0) and (1,0) at the ends (zero velocity, so every
   chained motion stays seamless) plus a few draggable interior points
   [u, v] — u = fraction of the clip's time, v = relative speed (unitless;
   the integral is normalized, so total distance is always exactly covered —
   raising one part of the curve implicitly slows the rest).
   Interpolation: MONOTONE cubic Hermite (Fritsch–Carlson limited
   tangents). Unlike plain Catmull-Rom, the curve can never overshoot
   between control points — so with the endpoints pinned at zero the
   velocity is >= 0 everywhere BY CONSTRUCTION and always descends
   smoothly into the endpoints. (Catmull-Rom + clamping could dive below
   zero after a sharp peak and get truncated, which froze the motion from
   nonzero speed — a visible snap at the end of the intro.) The "smooth"
   slider scales the tangents before limiting: lower = softer shoulders. */
const _lutCache={};
function tension(){ return Math.max(.25,Math.min(1.4,1.5-.5*CFG.smooth)); }
function curveEase(pts){
  const tau=tension();
  const key=JSON.stringify(pts)+"|"+tau.toFixed(3);
  if(_lutCache[key])return _lutCache[key];
  const P=[[0,0],...pts.map(p=>[+p[0],+p[1]]).sort((a,b)=>a[0]-b[0]),[1,0]];
  const n=P.length;
  /* secants, then Fritsch–Carlson monotone-limited tangents */
  const dx=[],d=[];
  for(let i=0;i<n-1;i++){ dx.push(Math.max(1e-4,P[i+1][0]-P[i][0]));
    d.push((P[i+1][1]-P[i][1])/dx[i]); }
  const m=new Array(n);
  m[0]=tau*d[0]; m[n-1]=tau*d[n-2];
  for(let i=1;i<n-1;i++) m[i]=(d[i-1]*d[i]<=0)?0:tau*(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){
    if(d[i]===0){ m[i]=0; m[i+1]=0; continue; }
    const a=m[i]/d[i], b=m[i+1]/d[i];
    const s=a*a+b*b;
    if(s>9){ const t3=3/Math.sqrt(s); m[i]=t3*a*d[i]; m[i+1]=t3*b*d[i]; }
  }
  const vel=u=>{                         /* monotone Hermite eval (>=0 always) */
    u=Math.max(0,Math.min(1,u));
    let i=0; while(i<n-2&&u>P[i+1][0])i++;
    const h=dx[i],t=(u-P[i][0])/h;
    const y0=P[i][1],y1=P[i+1][1],m0=m[i]*h,m1=m[i+1]*h;
    const t2=t*t,t3=t2*t;
    const y=(2*t3-3*t2+1)*y0+(t3-2*t2+t)*m0+(-2*t3+3*t2)*y1+(t3-t2)*m1;
    return Math.max(0,y);
  };
  const N=256, arr=[0]; let acc=0;
  for(let i=1;i<=N;i++){ acc+=vel((i-.5)/N); arr.push(acc); }
  const tot=Math.max(1e-6,arr[N]);
  const ease=t=>{ t=Math.max(0,Math.min(1,t));
    const x=t*N, i=Math.floor(x), fr=x-i;
    return (arr[i]+((arr[i+1]??arr[N])-arr[i])*fr)/tot; };
  const out={ease, vel:u=>vel(u)*N/tot, norm:tot/N}; /* vel: normalized (integrates to 1); norm: mean raw speed */
  _lutCache[key]=out; return out;
}

  /* if the intro layer is still mid-teardown (user scrolled within moments
     of the zoom landing), remove it NOW while the full-bleed hero still
     covers it — it must never sit above the carousel during the collapse */
  try{ if(intro&&intro.parentNode)intro.remove(); }catch(e){}
  proj.classList.remove("open"); backBtn.classList.remove("open");
  document.body.classList.remove("inproj");
  mm.classList.remove("open"); stripNav.classList.remove("hide");
  mode="strip"; lastInput=performance.now();
  pull=0; pullShown=0; topSince=null;
  f.t=0;                            /* clone glides back to its strip rect */
  /* the gesture that triggered this exit keeps emitting momentum events for
     up to a second or two — none of them may leak into the carousel, or it
     kicks into motion mid-settle. Swallow wheel input until the gesture
     actually ends (a real pause), not merely until the animation is done. */
  swallowStrip=true; swallowStart=lastStripWheel=performance.now(); swallowDir=0;
}
/* apply the focus rect for progress e: interpolates fRect -> full bleed.
   Used by BOTH the normal damped focus animation and the intro zoom, so the
   hero's trajectory into full-bleed is one code path everywhere. */
function setFocusRect(X,Y,W,H){
  focusEl.style.transform=`translate3d(${X}px,${Y}px,0)`;
  focusEl.style.width=W+"px"; focusEl.style.height=H+"px";
}
function applyFocus(e){
  const X=fRect.x*(1-e), Y=fRect.y*(1-e);
  const W=fRect.w+(innerWidth-fRect.w)*e, H=fRect.h+(innerHeight-fRect.h)*e;
  setFocusRect(X,Y,W,H);
  /* CROP CONTINUITY: strip images carry a parallax overscan crop
     (left -ov%, width 100+2ov%) plus a parallax x-shift; the full-bleed
     hero uses the plain 112% crop. The clone must interpolate its inner
     crop between the two along with its rect, or the moment it lands on
     (or lifts off) the real image the picture visibly jumps framing. */
  const ovStrip=Math.min(48,6+CFG.parallax*.7);        /* == layoutStrip */
  const ov=ovStrip*(1-e)+6*e;
  let shift=0;
  if(focusProj!=null){
    const lead=pics.find(q=>q.proj===focusProj&&q.isLead);
    if(lead){ const off=((lead.x+lead.w/2)-(s.c+innerWidth*.5))/innerWidth;
      shift=-off*CFG.parallax*(1-e); }                 /* == renderStrip */
  }
  focusPart.style.left=(-ov)+"%";
  focusPart.style.width=(100+2*ov)+"%";
  const py=mode==="project"?-ps.c*.06:0;
  focusPart.style.transform=`translate3d(${shift}%,${py}px,0)`;
  let rv=Math.max(0,Math.min(1,(performance.now()-revealStart)/900)); rv=rv*rv*(3-2*rv);
  focusTitle.style.opacity=Math.max(0,e*2-1)*Math.max(0,1-ps.c/240)*rv;
}
function renderFocus(dt){
  const l=f.t===1?CFG.expandIn:CFG.expandOut;
  f.v=reduced?f.t:damp(f.v,f.t,l,dt);
  /* while collapsing, retarget fRect to the lead's LIVE strip rect every
     frame — the strip may have been recentered (or still be gliding) since
     the rect was captured at click time, and the clone must land exactly
     on the real image wherever it is now, or the swap shows as a snap. */
  if(f.t===0&&focusProj!=null){
    const lead=pics.find(q=>q.proj===focusProj&&q.isLead);
    if(lead){ fRect={ x:lead.x-s.c, y:(innerHeight-lead.h)/2, w:lead.w, h:lead.h }; }
  }
  applyFocus(f.v);
  if(f.t===0&&f.v<.004){ focusEl.style.display="none"; focusTitle.style.opacity=0; }
}

/* ============ intro (v11 brick wall + Ken Burns) ============ */
const intro=document.getElementById("intro");
const iworld=document.getElementById("iworld");
const pctEl=document.getElementById("pct");
const tiles=[]; let focal=null;
(function buildWall(){
  /* NO-OVERLAP compression choreography:
     every tile in a row shares ONE eased progress e(t), but travels a
     distance that grows with its rank behind the row's leading edge:
         S_i = clear(leader) + rank_i * (pitch * spreadTiles)
     Spacing between neighbors is therefore  pitch + spread*(1-e):
     the queue starts stretched out offscreen, compresses monotonically,
     and lands at exact pitch — uneven -> even, never overlapping,
     trailing tiles visibly faster (they cover more ground in the same time). */
  const vw=innerWidth, vh=innerHeight;
  /* tiles share the VIEWPORT's aspect ratio, so the focal tile can expand
     to full-bleed without its cover-crop ever changing — the zoom is a pure
     uniform scale of the exact same picture. */
  const ROWS=4;
  const tileW=vw/4.6, tileH=vh/4.6;
  const gap=(vh-ROWS*tileH)/(ROWS+1);
  const pitch=tileW+gap;
  /* VERTICAL choreography: the wall is organized in COLUMNS. Even columns
     pour in from the top, odd columns rise from the bottom; within a
     column the queue starts stretched out and compresses to exact pitch
     as it lands (the same uneven -> even signature, transposed). Columns
     are brick-staggered by half a tile vertically. */
  const pitchY=tileH+gap;
  /* PASS 1 — lay out the grid (one cover column each side, so the
     centering shift can never expose bare background at an edge) and pick
     the tile nearest the viewport center as the focal. */
  let li=0, best=1e9;
  const colsArr=[];
  for(let c=-1;gap+c*pitch<vw+tileW;c++){
    const dir=(((c%2)+2)%2===0)?-1:1;  /* even columns from the top, odd from the bottom */
    const x=gap+c*pitch;
    const brick=(((c%2)+2)%2)*pitchY/2;
    const col=[];
    for(let k=-2;k*pitchY+brick<vh+tileH;k++){
      const fy=k*pitchY+brick;
      const t=document.createElement("div");
      t.className="t";
      iworld.appendChild(t);
      const rec={el:t,x,fy,dir,col:c};
      col.push(rec); tiles.push(rec);
      const d=Math.hypot(x+tileW/2-vw/2,fy+tileH/2-vh*.5);
      if(d<best){best=d;focal=rec;}
    }
    colsArr.push({col,dir,c});
  }
  /* PASS 2 — shift the WHOLE wall so the focal tile's final rect sits
     EXACTLY at the viewport center. The Ken Burns then becomes a pure
     centered scale: the image the camera dives into never drifts
     on its way to full-bleed. */
  const dxC=vw/2-(focal.x+tileW/2);
  const dyC=vh/2-(focal.fy+tileH/2);
  tiles.forEach(rec=>{
    rec.x+=dxC; rec.fy+=dyC;
    Object.assign(rec.el.style,{left:rec.x+"px",top:"0px",width:tileW+"px",height:tileH+"px",opacity:"0"});
  });
  /* PASS 3 — per-column travel distances (computed AFTER the shift):
     leader clears the screen, the queue trails with extra spacing that
     melts away as they land: start gap = pitch+spread -> final gap = pitch */
  colsArr.forEach(({col,dir,c})=>{
    col.sort((a,b)=> dir<0 ? b.fy-a.fy : a.fy-b.fy);   /* rank 0 = leader */
    const spread=pitchY*CFG.spreadTiles;
    const leader=col[0];
    const base=(dir<0 ? leader.fy+tileH+gap : vh-leader.fy+gap) + vh*.02;
    col.forEach((rec,rank)=>{
      rec.S = base + rank*spread;
      rec.rowDelay = (c+1)*CFG.rowStaggerMs;
    });
  });
  tiles.forEach(rec=>{
    if(rec===focal){
      /* the focal tile is never drawn — the hero element (#focus) plays its
         part from the very first frame, so there is no promotion moment and
         the zoom can overlap the slide-in freely. Keep the element for its
         layout math only. */
      rec.el.style.visibility="hidden";
    }else{
      rec.el.style.backgroundImage=`url('${WALL[li++%WALL.length]}')`;
    }
  });
  focal.rect={x:focal.x,y:focal.fy,w:tileW,h:tileH};
})();
const cam={s:1,tx:0,ty:0,sT:1,txT:0,tyT:0};
/* camera target: map the focal tile's FINAL rect exactly onto the viewport
   (tile aspect == viewport aspect, so this is exact in both dimensions) */
{ const fc=focal.rect;
  cam.sT=Math.max(innerWidth/fc.w,innerHeight/fc.h);
  cam.txT=innerWidth/2-cam.sT*(fc.x+fc.w/2);
  cam.tyT=innerHeight/2-cam.sT*(fc.y+fc.h/2); }
/* hero rides the whole intro: set it up before the first frame */
focusProj=0;
focusPart.style.backgroundImage=`url('${P[0].lead}')`;
focusTitle.textContent=P[0].t;
focusEl.style.display="block";
focusEl.style.zIndex="82";               /* above the intro wall */
focusEl.style.visibility="hidden";       /* until its row starts moving */
/* COLD-CACHE GUARD: on a first visit the wall must not start sliding until
   its images have actually decoded — an undecoded tile paints as nothing
   (a dark hole in the wall). Hold the intro clock until every image is
   ready, with a hard cap so a broken file can never stall the site. */
let introStart=performance.now(), introReady=false;
{
  /* the centered counter shows REAL load progress, quantized to jumps of
     17 so it snaps upward instead of crawling — and nothing on the wall
     moves until every image is decoded (hard 3s cap). */
  const urls=[...new Set(WALL)];
  let done=0;
  const show=()=>{ pctEl.textContent=Math.min(100,Math.ceil(done/urls.length*100/17)*17)+"%"; };
  show();
  const ps=urls.map(u=>new Promise(res=>{
    const im=new Image();
    const fin=()=>{ done++; show(); res(); };
    im.onload=()=>{ (im.decode?im.decode().catch(()=>{}):Promise.resolve()).then(fin); };
    im.onerror=fin; im.src=u;
  }));
  Promise.race([Promise.all(ps), new Promise(r=>setTimeout(r,3000))])
    .then(()=>{ pctEl.textContent="100%"; introReady=true;
      setTimeout(()=>pctEl.style.opacity=0,250); });
}

/* ============ minimap ============ */
const mm=document.getElementById("minimap");
const mmPage=document.getElementById("mm-page");
const mmWin=document.getElementById("mm-win");
let mmScale=1;
function buildMinimap(){
  mmPage.querySelectorAll(".mm-b").forEach(n=>n.remove());
  const total=ps.max+innerHeight;
  const H=mm.clientHeight;
  mmScale=H/total;
  const add=(top,h,cls,img)=>{
    const b=document.createElement("div");
    b.className="mm-b"+(cls?" "+cls:"");
    b.style.top=(top*mmScale)+"px"; b.style.height=Math.max(2,h*mmScale)+"px";
    if(img)b.style.backgroundImage=`url('${img}')`;
    mmPage.appendChild(b);
  };
  add(0,innerHeight,"mm-img",P[focusProj].lead);
  const body=document.getElementById("p-body");
  [...body.children].forEach(sec=>{
    const top=innerHeight+sec.offsetTop;
    const h=sec.getBoundingClientRect().height;
    if(sec.classList.contains("p-img")) add(top,h,"mm-img",P[focusProj].lead);
    else add(top+8,Math.max(0,h-16));
  });
  mmWin.style.height=(innerHeight*mmScale)+"px";
}
function mmSeek(e){
  const r=mm.getBoundingClientRect();
  const frac=Math.max(0,Math.min(1,(e.clientY-r.top-innerHeight*mmScale/2)/(r.height-innerHeight*mmScale)));
  ps.t=frac*ps.max;
}
let mmDrag=false;
mm.addEventListener("pointerdown",e=>{ mmDrag=true; mmSeek(e); });
addEventListener("pointermove",e=>{ if(mmDrag)mmSeek(e); });
addEventListener("pointerup",()=>mmDrag=false);

/* ============ main loop ============ */
const idxEl=document.getElementById("c-index");
const pScroll=document.getElementById("p-scroll");
let prev=performance.now();

function renderStrip(dt){
  s.c=reduced?s.t:damp(s.c,s.t,CFG.scrollEase,dt);
  if(Math.abs(s.t-s.c)<.1)s.c=s.t;
  track.style.transform=`translate3d(${-s.c}px,0,0)`;
  const viewC=s.c+innerWidth*.5;
  pics.forEach(q=>{
    const center=q.x+q.w/2;
    const off=(center-viewC)/innerWidth;
    if(Math.abs(off)>1.4){ q.el.style.visibility="hidden"; return; }
    q.el.style.visibility="visible";
    q.part.style.transform=`translate3d(${-off*CFG.parallax}%,0,0)`;
  });
  /* counter + filmstrip highlight: track the OPEN project when one is open,
     else the nearest cluster — keeps the bottom-right preview in sync */
  const cur = mode==="strip" ? nearest() : focusProj;
  idxEl.textContent=(cur+1)+" — "+N;
  stripBtns.forEach((b,i)=>b.classList.toggle("on",i===cur));
}

function frame(now){
  const dt=Math.min(.05,(now-prev)/1000); prev=now;

  if(mode==="intro"){
    if(!introReady)introStart=now;       /* hold at t=0 until images decoded */
    const tAbs=now-introStart;
    tiles.forEach(rec=>{
      if(rec===focal)return;             /* the hero plays the focal tile */
      const lp=(tAbs-CFG.introBlankMs-rec.rowDelay)/Math.max(200,CFG.introLoadMs-rec.rowDelay);
      const e=reduced?1:tileEase(lp);
      rec.el.style.opacity=(reduced||lp>0)?"1":"0";
      rec.el.style.transform=`translate3d(0,${rec.fy+rec.dir*rec.S*(1-e)}px,0)`;
    });
    /* focal tile position by the SAME row math ... */
    const flp=(tAbs-CFG.introBlankMs-focal.rowDelay)/Math.max(200,CFG.introLoadMs-focal.rowDelay);
    const fe=reduced?1:tileEase(flp);
    const fty=focal.fy+focal.dir*focal.S*(1-fe);
    /* ... while the Ken Burns zoom OVERLAPS the slide-in: it starts at
       zoomStartAt of the slide-in window, so the camera is already creeping
       in while tiles are still gliding to their spots. */
    const zt=(tAbs-CFG.introBlankMs-CFG.introHoldMs-CFG.introLoadMs*CFG.zoomStartAt)/CFG.introZoomMs;
    const ez=reduced?1:kbEase(zt);
    cam.s=1+(cam.sT-1)*ez; cam.tx=cam.txT*ez; cam.ty=cam.tyT*ez;
    iworld.style.transform=`translate3d(${cam.tx}px,${cam.ty}px,0) scale(${cam.s})`;
    /* the hero = the camera-mapped CURRENT focal-tile rect: while the wall
       zooms, the hero both finishes its slide and expands, in one motion,
       rendered at native resolution. When both clocks end it is exactly
       full-bleed (tile aspect == viewport aspect). */
    focusEl.style.visibility=(reduced||flp>0)?"visible":"hidden";
    setFocusRect(cam.tx+cam.s*focal.rect.x, cam.ty+cam.s*fty,
                 focal.rect.w*cam.s, focal.rect.h*cam.s);
    {
      const slideDone=tAbs>=CFG.introBlankMs+CFG.introLoadMs*1.02;
      if((slideDone&&zt>=1)||reduced){
        /* handoff -> PREVIEW: project 1's lead sits full-bleed with its title.
           The first scroll collapses it to the carousel; clicking it enters
           the project page proper. */
        document.getElementById("stage").classList.add("on");
        s.c=s.t=0;
        /* the hero is ALREADY full-bleed — only retarget fRect to the strip
           frame (for the later collapse FLIP). At e=1 fRect has zero weight,
           so this changes nothing on screen. */
        fRect={x:(innerWidth-pics[0].w)/2, y:(innerHeight-pics[0].h)/2, w:pics[0].w, h:pics[0].h};
        /* HANDOFF IS A NON-EVENT. The hero covers the whole viewport, so
           nothing behind it can show — but tearing down ~140 wall tiles
           synchronously here costs a layout+composite spike, i.e. a dropped
           frame at the exact moment the zoom lands, which reads as a snap.
           So this frame does only compositor-cheap work: fade the (hidden)
           intro layer out, and defer the actual DOM teardown to idle time,
           when the layer is both covered AND at opacity 0 — provably
           unpaintable, so removing it cannot change a single pixel. */
        intro.style.pointerEvents="none";
        intro.style.opacity="0";
        /* CRITICAL ORDER: the hero's z-index reset drops it to 64 — BELOW
           the intro's 80. The lingering (fading) dark sheet must therefore
           drop underneath the hero in the same frame, or it covers the
           screen for its fade = a black flash. z 1 keeps it under the hero
           and the chrome for the rest of its (invisible) life. */
        intro.style.zIndex="1";
        setTimeout(()=>{ (window.requestIdleCallback||(f=>f()))(
          ()=>{ if(intro.parentNode)intro.remove(); }); },2000);
        focusEl.style.zIndex="";
        f.v=1; f.t=1;
        mode="preview";
        /* chrome + title ease in gently, on their own clock */
        document.body.classList.remove("pre");
        revealStart=performance.now();
      }
    }
  }
  else if(mode==="strip"||mode==="preview"){
    if(mode==="strip"&&now-lastInput>CFG.idleMs&&!reduced){
      s.t=damp(s.t,clusterCenter[nearest()]-clusterCenter[0],CFG.magnet,dt);
    }
    renderStrip(dt);
    renderFocus(dt);
  }
  else if(mode==="project"){
    ps.c=reduced?ps.t:damp(ps.c,ps.t,CFG.pageScroll,dt);
    if(Math.abs(ps.t-ps.c)<.1)ps.c=ps.t;
    if(ps.c<=2&&ps.t<=0){ if(topSince===null)topSince=now; } else topSince=null;
    pullShown=reduced?0:damp(pullShown,pull,4.0,dt);
    if(pull>0)pull=Math.max(0,pull-140*dt);
    pScroll.style.transform=`translate3d(0,${-ps.c+pullShown*.38}px,0)`;
    renderStrip(dt);
    renderFocus(dt);
    const frac=ps.max?ps.c/ps.max:0;
    mmWin.style.transform=`translateY(${frac*(mm.clientHeight-innerHeight*mmScale)}px)`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ project ============ */
const proj=document.getElementById("project");
const backBtn=document.getElementById("backBtn");
function refreshProjectMetrics(){
  ps.max=Math.max(0,pScroll.scrollHeight-innerHeight);
  buildMinimap();
}
function enterProject(i){
  const p=P[i];
  document.getElementById("p-title").textContent=p.t;
  document.getElementById("p-meta1").textContent=p.meta;
  document.getElementById("p-role").textContent=p.role;
  document.getElementById("p-text").textContent=p.text;
  const imgs=document.getElementById("p-imgs");
  imgs.innerHTML=p.comps.map(c=>`<div class="p-img" style="background-image:url('${c}')"></div>`).join("");
  buildGate(p);
  document.getElementById("p-count").textContent=(i+1)+" — "+N;
  ps.c=ps.t=0; pull=0; pullShown=0; topSince=null;
  pScroll.style.transform="translate3d(0,0,0)";
  proj.classList.add("open"); backBtn.classList.add("open");
  document.body.classList.add("inproj");        /* Back owns the top-left */
  stripNav.classList.add("hide");
  mode="project";
  requestAnimationFrame(()=>{
    refreshProjectMetrics();
    mm.classList.add("open");
  });
}

/* ============ password gate (client-side AES-GCM) ============
   The locked half of each case study ships encrypted: extra text lives in
   LOCKDATA, extra images travel as assets/locked/*.enc. The password
   derives the key (PBKDF2); without it nothing readable is in the page or
   the network. One password unlocks the whole site for the session. */
let unlockKey=null;                       /* CryptoKey once validated */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(LOCKDATA.salt),iterations:150000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function tryPassword(pass){
  try{
    const k=await deriveKey(pass);
    const d=b64(LOCKDATA.check);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},k,d.slice(12));
    unlockKey=k;
    try{sessionStorage.setItem("pf-pass",pass);}catch(e){}
    return true;
  }catch(e){ return false; }
}
async function dec(ct){                    /* b64 -> ArrayBuffer */
  const d=b64(ct);
  return crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},unlockKey,d.slice(12));
}
async function revealLocked(p){
  const gate=document.getElementById("p-gate");
  const box=document.getElementById("p-locked");
  const txt=new TextDecoder().decode(await dec(LOCKDATA.text[p.lock]));
  let html=`<p>${txt.replace(/</g,"&lt;")}</p>`;
  box.innerHTML=html;
  for(const u of LOCKDATA.imgs[p.lock]){
    try{
      const buf=await fetch(u).then(r=>r.arrayBuffer());
      const plain=await crypto.subtle.decrypt(
        {name:"AES-GCM",iv:new Uint8Array(buf,0,12)},unlockKey,new Uint8Array(buf,12));
      const url=URL.createObjectURL(new Blob([plain],{type:"image/jpeg"}));
      const d=document.createElement("div"); d.className="p-img";
      d.style.backgroundImage=`url('${url}')`;
      box.appendChild(d);
    }catch(e){}
  }
  if(gate)gate.remove();
  refreshProjectMetrics();
}
function buildGate(p){
  let gate=document.getElementById("p-gate");
  let box=document.getElementById("p-locked");
  if(gate)gate.remove();
  if(box)box.remove();
  if(!p.lock||!LOCKDATA.text[p.lock])return;
  const imgs=document.getElementById("p-imgs");
  box=document.createElement("div"); box.id="p-locked";
  imgs.after(box);
  /* already unlocked this session (or stored password)? reveal silently */
  const stored=(()=>{try{return sessionStorage.getItem("pf-pass");}catch(e){return null;}})();
  if(unlockKey){ revealLocked(p); return; }
  if(stored){ tryPassword(stored).then(ok=>{ if(ok)revealLocked(p); }); }
  gate=document.createElement("div"); gate.id="p-gate";
  gate.innerHTML=`<div class="k">Client work — enter password for the full case study</div>
    <form id="p-gate-form"><input type="password" placeholder="Password" autocomplete="off">
    <button type="submit">Unlock</button></form><div class="msg"></div>`;
  box.after(gate);
  gate.querySelector("form").addEventListener("submit",async e=>{
    e.preventDefault();
    const inp=gate.querySelector("input"), msg=gate.querySelector(".msg");
    msg.textContent="";
    const ok=await tryPassword(inp.value.trim());
    if(ok){ revealLocked(P[focusProj]); }
    else{ msg.textContent="Incorrect password"; inp.value="";
      gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake"); }
  });
}
backBtn.addEventListener("click",closeFocus);
document.getElementById("p-next").addEventListener("click",()=>{
  const n=(focusProj+1)%N;
  s.c=s.t=clusterCenter[n]-clusterCenter[0];
  openFocus(n);
});
addEventListener("resize",()=>{
  layoutStrip();
  if(mode==="project"){ ps.max=Math.max(0,pScroll.scrollHeight-innerHeight); buildMinimap(); }
});
</script>
