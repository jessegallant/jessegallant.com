const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const d=b64(BLOB);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},k,d.slice(12)));
  try{sessionStorage.setItem("lab-pass",pass);}catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const m=document.getElementById("m"); m.textContent="";
  try{ await open_(document.getElementById("p").value.trim()); }
  catch(err){ m.textContent="Incorrect password"; document.getElementById("p").value=""; }
});
(()=>{ let s=null; try{s=sessionStorage.getItem("lab-pass");}catch(e){} if(s)open_(s).catch(()=>{}); })();
})();
